/* ---------- 規則引擎 ---------- */
const isHit=r=>['一安','二安','三安','全壘打'].includes(r);
const NO_RBI=['雙殺','失誤','不死三振','三振','其他'];
const occ=b=>String(b).split('').map(c=>c==='1');
// 預設跑壘結果：b=打者去向，m[i]=原本 i+1 壘跑者去向；0=出局 1~3=壘包 4=得分
function defaultRes(result,bases,outsBefore){
  const o=occ(bases),up=n=>[1,2,3].map(x=>Math.min(4,x+n)),hb={'一安':1,'二安':2,'三安':3,'全壘打':4}[result]||0;
  const chain=on=>{const d=[1,2,3];if(on[0]){d[0]=2;if(on[1]){d[1]=3;if(on[2])d[2]=4}}return d};
  const lead=on=>on[2]?2:on[1]?1:0;
  let b=1,d=[1,2,3];
  if(hb){b=hb;d=up(hb)}
  else if(result==='四壞'||result==='觸身球'){d=chain(o)}
  else if(result==='失誤'){d=up(1)}
  else if(result==='野選'){if(o.some(Boolean)){const l=lead(o),o2=o.slice();o2[l]=false;d=chain(o2);d[l]=0}else b=0}
  else if(result==='犧牲打'){b=0;if(outsBefore<2)d=up(1)}
  else if(result==='三振'||result==='飛球出局'||result==='滾地出局'){b=0}
  else if(result==='不死三振'){if(!o[0]||outsBefore>=2)d=chain(o);else b=0}
  else if(result==='雙殺'){b=0;if(o[0]){d=chain(o);d[0]=0}else d[lead(o)]=0}
  return{b,m:d};
}
function resolve(s,r){
  const res=r.res||defaultRes(r.result,s.bases,s.outs);
  if(!r.res&&r.mr){let k=r.mr;for(let i=2;i>=0&&k>0;i--)if(s.bases[i]==='1'&&res.m[i]!==0){res.m[i]=4;k--}}
  const nx=[0,0,0],mv=[];let runs=0,outsAdd=0,sc=0;
  s.bases.split('').forEach((c,i)=>{if(c!=='1')return;const d=res.m[i];mv.push({i,who:(s.rn&&s.rn[i])||'',d});if(d===0)outsAdd++;else if(d>=4){runs++;sc++}else nx[d-1]=(s.rn&&s.rn[i])||'?'});
  if(res.b===0)outsAdd++;else if(res.b>=4){runs++;sc++}else nx[res.b-1]=r.batter||'?';
  if(s.outs+outsAdd>=3&&!res.tp)runs=0;
  return{runs,outsAdd,nb:nx,sc,mv,bd:res.b};
}
const st=g=>g.records.length?g.records[g.records.length-1].after:{inning:1,half:'top',outs:0,bases:'000'};
function apply(s,r){
  let runs=0,outsAdd=0,rbi=0,nb;
  if(r.type==='pa'){const o=resolve(s,r);runs=o.runs;outsAdd=o.outsAdd;nb=o.nb;r.mv=o.mv;r.bd=o.bd;r.tp=!!(r.res&&r.res.tp);rbi=(r.rbiM!=null)?r.rbiM:(NO_RBI.includes(r.result)?0:runs);r.hits=isHit(r.result)?1:0;r.errors=r.result==='失誤'?1:0}
  else if(r.type==='run'){
    const b=s.bases.split('').map((c,k)=>c==='1'?((s.rn&&s.rn[k])||'?'):0);
    const si=r.base!==undefined?r.base:((b[0]&&!b[1])?0:(b[1]&&!b[2])?1:b[2]?2:b.findIndex(x=>x));
    if(r.result==='盜壘成功'){if(si===2){b[2]=0;runs=1}else if(si>=0){b[si+1]=b[si];b[si]=0}}
    else if(r.result==='盜壘失敗'){if(si>=0)b[si]=0;outsAdd=1}
    else{const k=r.base!==undefined?r.base:(b[0]?0:b.findIndex(x=>x));if(k>=0)b[k]=0;outsAdd=1}
    nb=b;r.hits=0;r.errors=0}
  else{nb=s.bases.split('').map((c,k)=>c==='1'?((s.rn&&s.rn[k])||'?'):0);r.hits=0;r.errors=0}
  r.runs=runs;r.rbi=rbi;r.pre={outs:s.outs,bases:s.bases,rn:s.rn||['','','']};r.outsAdd=outsAdd;r.outsTot=Math.min(3,s.outs+outsAdd);
  let outs=s.outs+outsAdd,inning=s.inning,half=s.half,bs=nb.map(x=>x?1:0).join(''),rn2=nb.map(x=>x||'');
  if(outs>=3){outs=0;bs='000';rn2=['','',''];if(half==='top')half='bottom';else{half='top';inning++}}
  r.after={inning,half,outs,bases:bs,rn:rn2};return r.after;
}
function replay(g){let s={inning:1,half:'top',outs:0,bases:'000'};g.records.forEach(r=>{r.inning=s.inning;r.half=s.half;s=apply(s,r)})}
const cnt=q=>{let b=0,s=0;for(const c of q){if(c==='B')b++;if(c==='S')s++;if(c==='F'&&s<2)s++}return{b,s}};
const teamOf=r=>r.half==='top'?'away':'home';

/* ---------- 計分板與統計 ---------- */
function board(g){
  const s=st(g),n=Math.max(9,s.inning),T={away:{r:0,h:0,e:0},home:{r:0,h:0,e:0}},I={away:{},home:{}};
  g.records.forEach(x=>{const b=teamOf(x),f=b==='away'?'home':'away';I[b][x.inning]=(I[b][x.inning]||0)+x.runs;T[b].r+=x.runs;T[b].h+=x.hits||0;T[f].e+=x.errors||0});
  const reached=(b,i)=>i<s.inning||(i===s.inning&&b==='away'&&s.half==='bottom');
  const row=b=>`<tr><td><b>${E(g[b])}</b></td>${Array.from({length:n},(_,k)=>`<td>${I[b][k+1]??(reached(b,k+1)?0:'-')}</td>`).join('')}<td>${T[b].r}</td><td>${T[b].h}</td><td>${T[b].e}</td></tr>`;
  return{html:`<div class="tw"><table class="sc"><thead><tr><th>隊伍</th>${Array.from({length:n},(_,k)=>`<th>${k+1}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${row('away')}${row('home')}</tbody></table></div>`,T,I,n};
}
const ipTxt=o=>`${Math.floor(o/3)}.${o%3}`;
function statData(g){
  replay(g);
  const D={away:{bat:{},pit:{}},home:{bat:{},pit:{}}};
  const B=(t,k)=>D[t].bat[k]||(D[t].bat[k]={name:k,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,k:0,bb:0,sb:0});
  const P=(t,k)=>D[t].pit[k]||(D[t].pit[k]={name:k,outs:0,bf:0,h:0,hr:0,k:0,bb:0,hbp:0,r:0,np:0});
  const okn=n=>n&&n!=='?';
  g.records.forEach(r=>{
    const bt=teamOf(r),ft=bt==='away'?'home':'away',pk=r.pitcher||'(未填)';
    if(r.type==='pa'){
      const b=B(bt,r.batter||'(未填)');b.pa++;if(!NON_AB.includes(r.result))b.ab++;b.h+=r.hits||0;
      if(r.result==='二安')b.d2++;if(r.result==='三安')b.d3++;if(r.result==='全壘打')b.hr++;b.rbi+=r.rbi||0;
      const K=r.result==='三振'||r.result==='不死三振',W=r.result==='四壞',H=r.result==='觸身球';
      if(K)b.k++;if(W||H)b.bb++;
      if(r.runs>0){(r.mv||[]).forEach(m=>{if(m.d>=4&&okn(m.who))B(bt,m.who).r++});if(r.bd>=4)b.r++}
      const p=P(ft,pk);p.bf++;p.outs+=r.outsAdd||0;p.h+=r.hits||0;if(r.result==='全壘打')p.hr++;if(K)p.k++;if(W)p.bb++;if(H)p.hbp++;p.r+=r.runs||0;
      p.np+=(r.seq||'').length+(['三振','不死三振','四壞'].includes(r.result)?0:1);
    }else if(r.type==='run'){
      const who=r.runner||r.batter;
      if(r.result==='盜壘成功'&&okn(who)){B(bt,who).sb++;if(r.runs>0)B(bt,who).r++}
      const p=P(ft,pk);p.outs+=r.outsAdd||0;p.r+=r.runs||0;
    }
  });
  return D;
}
const BAT_H=['打者','打席','打數','安打','二安','三安','全壘打','打點','得分','三振','四死','盜壘','打擊率'];
const PIT_H=['投手','局數','打者','被安打','被全壘打','三振','四壞','觸身','失分','球數'];
const batRow=o=>[o.name,o.pa,o.ab,o.h,o.d2,o.d3,o.hr,o.rbi,o.r,o.k,o.bb,o.sb,o.ab?(o.h/o.ab).toFixed(3):'-'];
const pitRow=o=>[o.name,ipTxt(o.outs),o.bf,o.h,o.hr,o.k,o.bb,o.hbp,o.r,o.np];
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="m">尚無資料</td></tr>`}</tbody></table></div>`;
function teamStats(g){
  const D=statData(g);
  return['away','home'].map(t=>`<h2 style="margin:14px 0 6px">${E(g[t])}　打者成績</h2>${tbl(BAT_H,Object.values(D[t].bat).map(batRow))}<h2 style="margin:14px 0 6px">${E(g[t])}　投手成績</h2>${tbl(PIT_H,Object.values(D[t].pit).map(pitRow))}`).join('');
}
const logRows=(g,del)=>[...g.records].reverse().map(r=>`<tr><td>${r.half==='top'?'▲':'▼'}${r.inning}</td><td>${E(r.type==='pa'?(r.batter||'-')+(r.note?' ※'+r.note:''):(r.note||r.batter||'-'))}</td><td>${E(r.pitcher||'')}</td><td class="mono">${E(r.seq||'')}</td><td><b>${E(r.result)}</b></td><td>${r.runs}</td><td>${r.rbi}</td>${del?(r.type==='pa'||r.type==='run'?`<td><button class="danger" onclick="delRec('${r.id}')">刪除</button></td>`:'<td></td>'):''}</tr>`).join('');

function csv(g){

function doSub(team){
  if(!roOK(cg()))return;
  const g=cg(),key=team==='away'?'ar':'hr',ro=g[key],lu=luOf(g,team),oi=+$('so').value,bi=$('si').value,mn=$('sn').value.trim(),np=$('sp').value;

async function qbRpc(fn,args){const{data,error}=await sb.rpc(fn,args);if(error){const e=new Error(error.message||String(error));e.code=error.code;throw e}return data}

function mkShim(){
  const rowMeta=r=>({away:r.away,home:r.home,ar:r.ar,hr:r.hr,lu:r.lu,pit:r.pit,status:r.status,side:r.side,seq:r.seq,stash:r.stash,sc:r.sc,upd:Number(r.upd)||0,created:Number(r.created)||0});
  const maps={
    games:{t:'qb_games',m:r=>({id:r.code,data:rowMeta(r)})},
    players:{t:'qb_players',m:r=>({id:r.id,data:{id:r.id,n:r.n,name:r.name,photo:r.photo,ord:Number(r.ord)}})},
    announcements:{t:'qb_announcements',m:r=>({id:r.id,data:{id:r.id,title:r.title,body:r.body,pin:r.pin,by:r.author,t:Number(r.t)}})}
  };
  const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
  const snapDocs=list=>({docs:list.map(d=>({id:d.id,exists:true,data:()=>d.data,metadata:{fromCache:false}})),metadata:{fromCache:false}});
  const watch=(table,filter,load,cb,err)=>{
    let dead=false,t=null;
    const run=async()=>{if(dead)return;try{cb(await load())}catch(e){if(err)err(e)}};
    run();
    const ch=sb.channel(table+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',Object.assign({event:'*',schema:'public',table},filter?{filter}:{}),()=>{clearTimeout(t);t=setTimeout(run,250)}).subscribe();
    const iv=setInterval(run,20000); // 即時通道失效時的備援輪詢
    return()=>{dead=true;clearInterval(iv);clearTimeout(t);try{sb.removeChannel(ch)}catch(e){}};
  };
  return{
    doc(path){
      const code=path.split('/')[1];
      const one=async()=>{const rows=await q(sb.from('qb_games').select('*').eq('code',code).limit(1));return rows&&rows[0]};
      const snap=r=>({id:code,exists:!!r,data:()=>r?rowMeta(r):undefined,metadata:{fromCache:false}});
      return{
        get:async()=>snap(await one()),
        set:async d=>{await qbRpc('qb_put_game',{p_code:code,p:d})},
        update:async d=>{await qbRpc('qb_update_game',{p_code:code,p:d})},
        delete:async()=>{await qbRpc('qb_admin_delete_game',{p_token:token,p_code:code})},
        onSnapshot:(cb,err)=>watch('qb_games','code=eq.'+code,async()=>snap(await one()),cb,err)
      };
    },
    collection(path){
      const parts=path.split('/');
      if(parts.length===3&&parts[2]==='records'){
        const code=parts[1];
        const load=async()=>snapDocs((await q(sb.from('qb_records').select('id,t,data').eq('code',code).order('t',{ascending:true}).limit(5000))).map(r=>({id:r.id,data:r.data})));
        return{
          doc:id=>({
            set:async r=>{await qbRpc('qb_put_record',{p_code:code,p_id:id,p_t:r.t,p_data:r})},
            delete:async()=>{try{await qbRpc('qb_undo_record',{p_code:code,p_id:id})}catch(e){if(token&&role==='admin')await qbRpc('qb_admin_delete_record',{p_token:token,p_code:code,p_id:id});else throw e}}
          }),
          get:load,
          onSnapshot:(cb,err)=>watch('qb_records','code=eq.'+code,load,cb,err)
        };
      }
      const name=parts[0],mp=maps[name];
      const load=async()=>snapDocs((await q(sb.from(mp.t).select('*'))).map(mp.m));
      return{
        doc:id=>({
          set:async o=>{if(name==='players')await qbRpc('qb_upsert_player',{p_token:token,p:o});else throw new Error('unsupported')},
          delete:async()=>{if(name==='players')await qbRpc('qb_delete_player',{p_token:token,p_id:id});else if(name==='announcements')await qbRpc('qb_delete_announcement',{p_token:token,p_id:id});else throw new Error('unsupported')}
        }),
        get:load,
        onSnapshot:(cb,err)=>watch(mp.t,null,load,cb,err)
      };
    }
  };
}

function paCount(g){return g.records.filter(r=>r.type==='pa').length}

function decSeq(v){const m=/^(\d+)\|(.*)$/.exec(v||'');return m?{n:+m[1],seq:m[2]}:{n:-1,seq:''}}
function syncMeta(g,patch){ // 依序寫入，避免快速連點時後送的請求先到、被舊值蓋掉

  mq[code]=(mq[code]||Promise.resolve()).then(()=>wr(()=>GD(code).update(body))).catch(()=>{}).then(()=>{g.pend=Math.max(0,(g.pend||1)-1)});
}

function subGames(){
  SY.collection('games').onSnapshot(q=>{
    const seen=new Set();
    q.docs.forEach(d=>{
      const m=clone(d.data()),code=d.id;seen.add(code);let g=db.games.find(x=>x.code===code);
      if(!g){g={...m,id:uid(),code,records:[],seq:'',_rseq:decSeq(m.seq),stash:m.stash||[],sync:true};db.games.push(g)}
      else if(!unsubMap[code])Object.assign(g,{away:m.away,home:m.home,ar:m.ar,hr:m.hr,lu:m.lu,pit:m.pit,status:m.status,side:m.side,sc:m.sc,upd:m.upd,sync:true});
      else{g.sc=m.sc;g.upd=m.upd;g.sync=true}
    });
    if(!q.metadata.fromCache){
      const gone=db.games.filter(g=>g.code&&g.sync&&!seen.has(g.code));
      if(gone.length){gone.forEach(g=>detach(g.code));db.games=db.games.filter(g=>!gone.includes(g));if(db.cur&&!db.games.some(g=>g.id===db.cur))db.cur=null}
    }
    save();softRender();
  },()=>{});
}

let uploading=false;
async function putRetry(fn){for(let i=0;i<4;i++){try{await fn();return true}catch(e){if(e&&e.code==='resource_exhausted'){await new Promise(r=>setTimeout(r,700*(i+1)));continue}return false}}return false}
async function uploadGame(g){
  let code=g.code;
  if(!code){for(let i=0;i<8&&!code;i++){const c=String(Math.floor(Math.random()*10000)).padStart(4,'0');const x=await GD(c).get();if(!x.exists)code=c}if(!code)throw new Error('code');g.code=code}
  if(!g.sync)await GD(code).set(metaOf(g));
  g.sync=true;let ok=0;
  for(const r of g.records){if(await putRetry(()=>RC(code).doc(r.id).set(clone(r))))ok++}
  attach(g);return{ok,total:g.records.length};
}
async function uploadAll(){
  if(needAdmin())return;
  if(uploading)return;
  await readyP;
  if(!SY){toast('尚未連上伺服器，請稍後再試');return}
  if(!canW){toast('你沒有共用資料庫的寫入權限，無法上傳');return}
  uploading=true;const btn=$('upbtn');if(btn){btn.disabled=true;btn.textContent='上傳中…'}
  const R=[];
  const batch=async(name,list,col,needAdm)=>{
    if(needAdm&&!canAdm){R.push(`${name}：略過（沒有管理權限，需平台擁有者或編輯者）`);return}
    let ok=0;for(const it of list){const x={...it};delete x.local;if(await putRetry(()=>SY.collection(col).doc(x.id).set(clone(x)))){ok++;it.local=false}}
    R.push(`${name}：${ok}／${list.length} 筆${ok<list.length?' ⚠️ 有失敗':' ✔'}`);
  };
  try{
    db.players.forEach((p,i)=>{if(p.ord===undefined)p.ord=i});
    await batch('球員與大頭貼',db.players,'players',true);
    await batch('後台使用者',db.users,'users',true);
    await batch('公告',db.ann,'announcements',false);
    const gs=db.games.filter(g=>!(g.sync&&!g.records.length));let gok=0,rok=0,rall=0,gfail=0;
    for(const g of gs){try{const r=await uploadGame(g);gok++;rok+=r.ok;rall+=r.total}catch(e){gfail++}}
    R.push(`比賽：${gok}／${gs.length} 場，紀錄 ${rok}／${rall} 筆${gfail||rok<rall?' ⚠️ 有失敗':' ✔'}`);
    db.lastUpload=Date.now();save();
  }catch(e){R.push('發生錯誤：'+(e&&e.message||'未知'))}
  uploading=false;
  modal(`<h2>⬆️ 上傳結果</h2><div style="line-height:1.9">${R.map(E).join('<br>')}</div><div class="m" style="font-size:12px;margin-top:8px">已存在的資料會被覆蓋為這台裝置的版本。</div><button class="pri" style="width:100%;margin-top:10px" onclick="modal('')">確定</button>`);
  render();
}

const unsubMap={};

function attach(g){
  if(!SY||!g||!g.code||unsubMap[g.code])return;
  const keys=Object.keys(unsubMap);if(keys.length>=20){const cc=attachedCode();const old=keys.find(k=>k!==cc);if(old)detach(old)}
  const arr=unsubMap[g.code]=[];
  arr.push(GD(g.code).onSnapshot(sn=>{if(!sn.exists)return;const m=clone(sn.data()),d=decSeq(m.seq);g._rseq=d;g.sync=true;if(!g.pend){Object.assign(g,{away:m.away,home:m.home,ar:m.ar,hr:m.hr,lu:m.lu,pit:m.pit,status:m.status,side:m.side,sc:m.sc,upd:m.upd});g.stash=m.stash||[];if(d.n===paCount(g))g.seq=d.seq}save();softRender()},()=>{}));
  arr.push(RC(g.code).onSnapshot(q=>{
    const rem=q.docs.map(d=>clone(d.data())),ids=new Set(rem.map(r=>r.id)),now=Date.now();
    g.pendIds=g.pendIds||{};g.delIds=g.delIds||{};
    Object.keys(g.pendIds).forEach(id=>{if(ids.has(id)||now-g.pendIds[id]>60000)delete g.pendIds[id]});
    Object.keys(g.delIds).forEach(id=>{if(!ids.has(id)||now-g.delIds[id]>60000)delete g.delIds[id]});
    const keep=g.records.filter(r=>g.pendIds[r.id]&&!ids.has(r.id)); // 剛寫入、伺服器還沒回報的紀錄先保留，避免被舊清單蓋掉
    g.records=rem.filter(r=>!g.delIds[r.id]).concat(keep).sort((a,b)=>(a.t-b.t)||(a.id<b.id?-1:1));
    replay(g);
    const n=paCount(g);
    if(g.seqN!==undefined&&g.seqN!==n&&!g.pend)g.seq=''; // 別台裝置記錄了新打席：目前這一球的累計作廢
    g.seqN=n;
    if(!g.pend&&g._rseq&&g._rseq.n===n)g.seq=g._rseq.seq;
    save();softRender();
  },()=>{}));
}

function playByPlay(g){

  catch(e){if(/exists/.test(e.message||''))toast('此帳號已存在');else authFail(e)}
}
function delUser(id){if(needAdmin())return;const u=db.users.find(x=>x.id===id);modal(`<h2>刪除使用者？</h2><p>${E(u?u.name:'')}</p><div class="row"><button class="pri" onclick="doDelUser('${id}')">刪除</button><button onclick="modal('')">取消</button></div>`)}
async function doDelUser(id){if(needAdmin())return;try{await qbRpc('qb_delete_staff',{p_token:token,p_id:id});await refreshStaff();modal('');render();toast('已刪除')}catch(e){modal('');authFail(e)}}
function usersAdmin(){
  if(!staffLoaded){staffLoaded=true;refreshStaff()}
  return`<div class="card"><h2>新增後台使用者</h2><div class="g2"><div><label>帳號</label><input id="un" autocomplete="off"></div><div><label>密碼（至少 6 字元）</label><input id="up" type="password" autocomplete="new-password"></div></div><button class="pri" style="margin-top:10px" onclick="addUser()">新增使用者</button><p class="m" style="font-size:12px">後台使用者只能「發布公告」與「查看比賽紀錄、匯出 Excel」。刪除、修改與管理等權限由伺服器端把關，不是只靠畫面隱藏。</p></div>
  <div class="card"><h2>後台帳號（${db.users.length}）</h2>${db.users.map(u=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)"><div><b>${E(u.name)}</b>${u.role==='admin'?' <span class="chip">管理員</span>':''}<div class="m" style="font-size:12px">${new Date(u.created).toLocaleDateString('zh-TW')}</div></div>${u.role==='admin'?'':`<button class="danger" onclick="delUser('${u.id}')">刪除</button>`}</div>`).join('')||'<div class="m">載入中…</div>'}</div>`;
}
async function purgeRemote(g){if(!SY||!g.code||role!=='admin')return;try{await GD(g.code).delete()}catch(e){}}
function saveBlob(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已下載 '+name)}
async function dl(name,text){saveBlob(name,new Blob([text],{type:name.endsWith('.html')?'text/html':name.endsWith('.csv')?'text/csv':'application/json'}))}
async function dlBin(name,buf){saveBlob(name,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
async function uploadAll(){
  if(needAdmin())return;
  if(uploading)return;
  if(!SY){toast('尚未連上伺服器');return}
  uploading=true;const btn=$('upbtn');if(btn){btn.disabled=true;btn.textContent='上傳中…'}
  const R=[];
  try{
    const players=db.players.map((p,i)=>({id:p.id,n:p.n,name:p.name,photo:p.photo||'',ord:p.ord??i}));
    const announcements=db.ann.map(a=>({id:a.id,title:a.title,body:a.body,pin:!!a.pin,author:a.by||'',t:a.t}));
    const r=await qbRpc('qb_import_all',{p_token:token,p:{players,announcements}});
    R.push(`球員 ${r.players} 筆、公告 ${r.announcements} 筆 ✔`);
    const gs=db.games.filter(g=>!(g.sync&&!g.records.length));let gok=0,rok=0,rall=0,gf=0;
    for(const g of gs){try{const x=await uploadGame(g);gok++;rok+=x.ok;rall+=x.total}catch(e){gf++}}
    R.push(`比賽：${gok}／${gs.length} 場，紀錄 ${rok}／${rall} 筆${gf||rok<rall?' ⚠️ 有失敗':' ✔'}`);
    db.lastUpload=Date.now();save();
  }catch(e){if(/unauthorized/.test(e.message||'')){uploading=false;authFail(e);return}R.push('發生錯誤：'+(e&&e.message||'未知'))}
  uploading=false;
  modal(`<h2>⬆️ 上傳結果</h2><div style="line-height:1.9">${R.map(E).join('<br>')}</div><div class="m" style="font-size:12px;margin-top:8px">已存在的資料會被這台裝置的版本覆蓋。</div><button class="pri" style="width:100%;margin-top:10px" onclick="modal('')">確定</button>`);
  render();
}

render();
</script></body></html>
